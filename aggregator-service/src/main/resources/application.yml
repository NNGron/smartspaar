#spring.application.name=aggregator-service
server:
  port: 8081

spring:
  application:
    name: aggregator-service
  data:
    redis:
      host: localhost
      port: 6379

stores:
  jumbo:
    url: http://localhost:8091
  ah:
    url: http://localhost:8092
  lidl:
    url: http://localhost:8093

catalog:
  url: http://localhost:8095

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html