# docker-compose.yml for SmartSpaar infrastructure
# Includes: PostgreSQL, Redis, Kafka, Zookeeper, pgAdmin, Prometheus, Grafana, Jaeger, Keycloak, Nginx

version: '3.8'

services:

  # PostgreSQL database for storing core data (users, groups, lists, etc.)
  postgres:
    image: postgres:16
    container_name: smartspaar-postgres
    environment:
      POSTGRES_USER: smartspaar         # Default DB username
      POSTGRES_PASSWORD: secret         # Default DB password
      POSTGRES_DB: smartspaar_db        # Default DB name
    ports:
      - "5433:5432"                     # Maps container port 5432 to host port 5433
    volumes:
      - pgdata:/var/lib/postgresql/data # Persistent volume for PostgreSQL data
    networks:
      - smartspaar-net

  # Redis cache for session storage, fast access, and temporary data
  redis:
    image: redis:7
    container_name: smartspaar-redis
    ports:
      - "6378:6379"                     # Default Redis port
    networks:
      - smartspaar-net

  # Zookeeper for managing Kafka cluster coordination
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    container_name: smartspaar-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181       # Default Zookeeper port
    ports:
      - "2181:2181"
    networks:
      - smartspaar-net

  # Kafka message broker for event-driven communication between microservices
  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: smartspaar-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    networks:
      - smartspaar-net

  # pgAdmin UI for managing PostgreSQL database
  pgadmin:
    image: dpage/pgadmin4
    container_name: smartspaar-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@smartspaar.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "8081:80"                       # Access pgAdmin via localhost:8081
    networks:
      - smartspaar-net

  # Prometheus for collecting metrics from services
  prometheus:
    image: prom/prometheus
    container_name: smartspaar-prometheus
    ports:
      - "9090:9090"                     # Prometheus UI
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml # Prometheus config
    networks:
      - smartspaar-net

  # Grafana dashboard for visualizing metrics from Prometheus
  grafana:
    image: grafana/grafana
    container_name: smartspaar-grafana
    ports:
      - "3000:3000"         # Grafana UI   # grafana username: admin  #grafana password: admin123
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./monitoring/grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml
      - ./monitoring/grafana-dashboard.yml:/etc/grafana/provisioning/dashboards/dashboard.yml
      - ./monitoring/grafana-dashboard.json:/etc/grafana/provisioning/dashboards/grafana-dashboard.json
    networks:
      - smartspaar-net
# Prometheus اضافه شدن این سه سرویس تا بتونه ازشون داده بگیره.
  redis-exporter:
    image: oliver006/redis_exporter
    container_name: smartspaar-redis-exporter
    ports:
      - "9121:9121" # Redis metrics exposed here
    command: --redis.addr=redis://smartspaar-redis:6379
    networks:
      - smartspaar-net

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter
    container_name: smartspaar-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://smartspaar:secret@smartspaar-postgres:5432/smartspaar_db?sslmode=disable"
    ports:
      - "9187:9187" # PostgreSQL metrics exposed here
    networks:
      - smartspaar-net

  kafka-exporter:
    image: danielqsj/kafka-exporter
    container_name: smartspaar-kafka-exporter
    ports:
      - "9308:9308" # Kafka metrics exposed here
    environment:
      KAFKA_SERVER: smartspaar-kafka:9092
    networks:
      - smartspaar-net

  # Jaeger for distributed tracing across microservices
  jaeger:
    image: jaegertracing/all-in-one:1.52
    container_name: smartspaar-jaeger
    ports:
      - "16686:16686"                   # Jaeger UI
      - "6831:6831/udp"                 # Agent port
      - "14268:14268"                   # Collector port
    networks:
      - smartspaar-net

  # Keycloak for authentication and user management
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: smartspaar-keycloak
    command: start-dev                 # Starts Keycloak in dev mode with embedded H2 DB
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
    ports:
      - "8080:8080"                    # Keycloak UI
    networks:
      - smartspaar-net

  # Nginx for serving frontend files (e.g., Flutter web build)
  nginx:
    image: nginx:latest
    container_name: smartspaar-nginx
    ports:
      - "80:80"                        # Public web access
    volumes:
      - ./frontend:/usr/share/nginx/html # Mounts frontend build directory
    networks:
      - smartspaar-net

# Persistent volumes for PostgreSQL and Grafana
volumes:
  pgdata:
  grafana-storage:

# Shared network for all services
networks:
  smartspaar-net:


#docker-compose up     همه‌ی سرویس‌ها با هم ساخته میشن.